<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARABISK — ذكريات</title><style>
:root{--bg:#f5efe6;--ink:#1d1711;--muted:#786f64;--card:#fffdf9;--line:#e7ddd0;--gold:#b88a3b;--dark:#17130f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:5;background:rgba(245,239,230,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:2px}.back,.pill,.publish{padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}.wrap{max-width:820px;margin:auto;padding:30px 16px 80px}.hero{text-align:center;padding:12px 0 25px}.eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold);font-weight:800}.hero h1{font:500 44px Georgia,serif;margin:8px 0}.hero p{color:var(--muted);line-height:1.9}.composer,.memory{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(45,31,15,.07);margin-bottom:20px}.composer{padding:20px}.composer textarea{width:100%;min-height:105px;border:0;outline:0;background:transparent;font:inherit;resize:vertical}.identity{display:flex;margin:12px 0}.identity input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.row,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file{display:inline-block;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}.file input{display:none}.publish{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:700}.note{color:var(--muted);font-size:12px}.tabs{margin:26px 0}.tab.active{background:var(--dark);color:#fff}.memory{overflow:hidden}.head{display:flex;justify-content:space-between;padding:17px 18px}.name{font-weight:800}.date{color:var(--muted);font-size:12px}.text{padding:0 18px 18px;line-height:1.95;white-space:pre-wrap}.media{width:100%;display:block;max-height:620px;object-fit:cover;background:#111}.video{position:relative;background:#111}.play{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:#fff;font-size:20px}.actions{display:flex;border-top:1px solid var(--line)}.actions button{flex:1;padding:13px;border:0;background:transparent;cursor:pointer;color:var(--muted)}.comment{display:none;padding:12px 18px;border-top:1px solid var(--line);gap:8px}.comment.open{display:flex}.comment input{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px}.empty{text-align:center;color:var(--muted);padding:35px}@media(max-width:600px){.hero h1{font-size:35px}.actions button{font-size:11px}.media{max-height:470px}}</style></head><body>
<header class="nav"><strong class="brand">ARABISK</strong><a class="back" href="/">الرئيسية</a></header><main class="wrap"><section class="hero"><div class="eyebrow">ARABISK MEMORIES</div><h1>ذكريات</h1><p>شارك لحظتك من ARABISK، بصورة أو فيديو أو كلمات بسيطة. كل الذكريات هنا عامة.</p></section>
<section class="composer"><textarea id="text" placeholder="اكتب ذكرى أو لحظة جميلة…"></textarea><div class="identity"><input id="name" maxlength="80" placeholder="اسمك أو اسم مستعار — اتركه فارغًا ليظهر «مجهول»"></div><div class="row"><label class="file">إضافة صورة أو فيديو<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif,video/mp4,video/webm,video/quicktime"></label><span id="fileName" class="note"></span><button id="publish" class="publish">نشر الذكرى</button><span id="message" class="note"></span></div></section>
<div class="tabs"><button class="pill tab active" data-sort="latest">الأحدث</button><button class="pill tab" data-sort="popular">الأكثر تفاعلًا</button></div><section id="feed"></section></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let sort='latest';
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt?.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'حدث خطأ');return d}
function card(m){const media=m.mediaType==='image'&&m.imageUrl?'<img class="media" src="'+esc(m.imageUrl)+'" alt="" loading="lazy">':m.mediaType==='video'&&m.videoUrl?'<div class="video"><video class="media" src="'+esc(m.videoUrl)+'" controls playsinline preload="metadata"></video><button class="play" onclick="this.previousElementSibling.play();this.remove()">▶</button></div>':'';return '<article class="memory"><div class="head"><span class="name">'+esc(m.displayName||'مجهول')+'</span><span class="date">'+new Date(m.createdAt).toLocaleString('ar-AE')+'</span></div>'+media+(m.text?'<div class="text">'+esc(m.text)+'</div>':'')+'<div class="actions"><button onclick="likeMemory(\''+esc(m.id)+'\')">♡ إعجاب <b>'+m.likes+'</b></button><button onclick="commentToggle(\''+esc(m.id)+'\')">◯ تعليق <b>'+m.commentsCount+'</b></button><button onclick="shareMemory(\''+esc(m.id)+'\')">↗ مشاركة <b>'+m.shareCount+'</b></button><button onclick="reportMemory(\''+esc(m.id)+'\')">⋯ إبلاغ</button></div><div class="comment" id="c-'+esc(m.id)+'"><input id="ci-'+esc(m.id)+'" maxlength="500" placeholder="اكتب تعليقًا…"><button onclick="commentMemory(\''+esc(m.id)+'\')">إرسال</button></div></article>'}
async function load(){const f=$('#feed');f.innerHTML='<div class="empty">جارٍ تحميل الذكريات…</div>';try{const d=await api('/api/memories?sort='+sort);f.innerHTML=d.length?d.map(card).join(''):'<div class="empty">لا توجد ذكريات بعد. كن أول من يشارك لحظته.</div>'}catch(e){f.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function commentToggle(id){$('#c-'+id)?.classList.toggle('open')}async function likeMemory(id){try{await api('/api/memories/'+id+'/like',{method:'POST'});load()}catch(e){alert(e.message)}}async function shareMemory(id){try{const url=location.href.split('#')[0]+'#'+id;await navigator.clipboard?.writeText(url);await api('/api/memories/'+id+'/share',{method:'POST'});alert('تم نسخ رابط الذكرى.')}catch(e){alert(e.message)}}async function reportMemory(id){const reason=prompt('سبب الإبلاغ؟');if(!reason)return;try{await api('/api/memories/'+id+'/report',{method:'POST',body:JSON.stringify({reason})});alert('تم إرسال البلاغ للمراجعة.')}catch(e){alert(e.message)}}async function commentMemory(id){const i=$('#ci-'+id);if(!i?.value.trim())return;try{await api('/api/memories/'+id+'/comments',{method:'POST',body:JSON.stringify({text:i.value,displayName:$('#name').value.trim()||'مجهول'})});i.value='';load()}catch(e){alert(e.message)}}
$('#file').addEventListener('change',e=>$('#fileName').textContent=e.target.files[0]?.name||'');$('#publish').addEventListener('click',async()=>{const b=$('#publish'),file=$('#file').files[0],text=$('#text').value.trim(),name=$('#name').value.trim();if(!text&&!file)return alert('أضف نصًا أو صورة أو فيديو.');b.disabled=true;$('#message').textContent='جاري النشر…';try{let imageKey='',videoKey='';if(file){const p=await api('/api/memories/upload',{method:'POST',body:JSON.stringify({fileName:file.name,contentType:file.type,size:file.size})});const u=await fetch(p.uploadUrl,{method:'PUT',headers:{'Content-Type':file.type},body:file});if(!u.ok)throw Error('فشل رفع الوسائط.');if(p.kind==='image')imageKey=p.key;else videoKey=p.key}await api('/api/memories',{method:'POST',body:JSON.stringify({text,displayName:name,imageKey,videoKey})});$('#text').value='';$('#file').value='';$('#fileName').textContent='';$('#message').textContent='تم نشر الذكرى.';load()}catch(e){$('#message').textContent=e.message}finally{b.disabled=false}});document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');sort=x.dataset.sort;load()}));load();
</script></body></html>
