<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARABISK — ذكريات</title>
<style>
:root{
  --bg:#f3eee5;--paper:#fffdf9;--paper-2:#f9f5ee;--ink:#1d1914;--muted:#81776b;
  --line:#e8dfd3;--gold:#b88a3b;--gold-soft:#efe2c7;--dark:#171310;--white:#fff;
  --shadow:0 18px 50px rgba(47,34,20,.08);--radius:26px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% -10%,#fffaf2 0,#f3eee5 42%,#eee6da 100%);color:var(--ink);font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(184,138,59,.035),transparent 35%,rgba(23,19,16,.025));z-index:-1}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
.nav{position:sticky;top:0;z-index:20;background:rgba(243,238,229,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(232,223,211,.9);padding:15px max(18px,5vw);display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;letter-spacing:3px;font-size:20px}
.back{padding:10px 17px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);font-weight:700;box-shadow:0 5px 14px rgba(34,25,16,.04)}
.wrap{max-width:860px;margin:auto;padding:30px 16px 90px}
.hero{text-align:center;padding:10px 0 28px}
.eyebrow{font-size:10px;letter-spacing:5px;color:var(--gold);font-weight:900}
.hero h1{font:500 52px Georgia,serif;margin:7px 0 6px}
.hero p{max-width:620px;margin:0 auto;color:var(--muted);line-height:1.95;font-size:15px}
.composer,.memory{background:rgba(255,253,249,.95);border:1px solid rgba(232,223,211,.95);border-radius:var(--radius);box-shadow:var(--shadow)}
.composer{padding:18px 18px 15px;margin-bottom:18px}
.composer-top{display:flex;gap:13px;align-items:flex-start}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#1e1914,#41372e);color:#fff;font-weight:800;flex:0 0 auto}
.composer-main{flex:1}
.composer textarea{display:block;width:100%;min-height:98px;border:0;outline:0;background:transparent;resize:vertical;font-size:17px;line-height:1.75;color:var(--ink)}
.composer textarea::placeholder{color:#a79d91}
.identity input{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--paper-2);outline:0}
.identity input:focus{border-color:#d8c19a;box-shadow:0 0 0 3px rgba(184,138,59,.09)}
.composer-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.publish-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.media-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:700;transition:.18s}
.media-btn:hover{transform:translateY(-1px);border-color:#d4c3a7;background:#fffaf3}
.media-btn svg,.action-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.file input{display:none}
.publish{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid var(--dark);border-radius:13px;background:var(--dark);color:#fff;font-weight:800;min-width:138px;box-shadow:0 8px 18px rgba(23,19,16,.13)}
.publish:disabled{opacity:.6;cursor:wait}
.publish svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9}
.note{color:var(--muted);font-size:12px}
.message{font-weight:700}
.selected-media{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-top:10px;border:1px dashed #d7cab8;border-radius:13px;background:#fcf9f3;color:var(--muted);font-size:12px}
.selected-media.show{display:flex}
.selected-media button{border:0;background:transparent;color:#8d3f37;font-size:12px;font-weight:800}
.tabs{display:flex;gap:8px;align-items:center;justify-content:center;margin:25px 0 18px}
.pill{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.85);color:var(--muted);font-weight:700}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.memory{overflow:hidden;margin-bottom:20px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:17px 18px}
.publisher{display:flex;align-items:center;gap:10px;min-width:0}
.mini-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#c7a56d,#6d5537);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
.name{font-weight:900;display:block}
.date{color:var(--muted);font-size:11px;margin-top:2px;display:block}
.more{border:0;background:transparent;color:#6c6257;font-size:20px;line-height:1}
.text{padding:0 18px 18px;line-height:2;font-size:16px;white-space:pre-wrap}
.media{width:100%;display:block;max-height:680px;object-fit:cover;background:#111}
.video{position:relative;background:#111}
.play{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:21px;color:#171310}
.stats{display:flex;gap:13px;padding:0 18px 12px;color:var(--muted);font-size:12px}
.stats span{display:inline-flex;align-items:center;gap:5px}
.actions{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.action-btn{flex:1;min-width:0;border:0;background:transparent;padding:13px 8px;color:#6e6459;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;transition:.18s}
.action-btn:hover{background:#faf6ef;color:var(--ink)}
.action-btn.liked{color:#a23b35}
.comments{padding:15px 18px 10px;background:linear-gradient(180deg,#fffdf9 0,#faf6ef 100%)}
.comments-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:900}
.comments-title span{color:var(--muted);font-weight:600}
.comment-list{display:flex;flex-direction:column;gap:10px}
.comment-item{display:flex;gap:9px;align-items:flex-start}
.comment-avatar{width:31px;height:31px;border-radius:50%;background:#e6dccd;display:grid;place-items:center;font-size:11px;font-weight:900;color:#655846;flex:0 0 auto}
.comment-bubble{background:#f0eadf;border-radius:16px;padding:8px 11px;min-width:0;flex:1}
.comment-author{font-size:12px;font-weight:900}
.comment-text{font-size:13px;line-height:1.7;margin-top:2px;white-space:pre-wrap}
.comment-date{font-size:10px;color:var(--muted);margin-top:3px}
.no-comments{color:var(--muted);font-size:12px;padding:5px 0 8px}
.comment-form{display:flex;gap:8px;margin-top:12px}
.comment-form input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0;min-width:0}
.comment-form input:focus{border-color:#d8c19a;box-shadow:0 0 0 3px rgba(184,138,59,.08)}
.comment-form button{padding:10px 14px;border:1px solid var(--dark);border-radius:12px;background:var(--dark);color:#fff;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:42px 20px;background:rgba(255,253,249,.72);border:1px dashed #d9cdbd;border-radius:20px}
@media(max-width:640px){
  .wrap{padding-top:20px}.hero h1{font-size:42px}.hero p{font-size:14px}
  .composer-top{gap:9px}.avatar{width:38px;height:38px}.composer textarea{font-size:15px;min-height:88px}
  .composer-bottom{align-items:stretch}.publish-tools{width:100%}.publish{width:100%}
  .media-btn{flex:1;justify-content:center}.action-btn{font-size:11px}.action-btn svg{width:17px;height:17px}
  .media{max-height:520px}.stats{font-size:11px}
}
</style>
</head>
<body>
<header class="nav">
  <strong class="brand">ARABISK</strong>
  <a class="back" href="/">الرئيسية</a>
</header>

<main class="wrap">
<section class="hero">
  <div class="eyebrow">ARABISK MEMORIES</div>
  <h1>ذكريات</h1>
  <p>مكان تجمع فيه لحظات ARABISK. انشر صورة أو فيديو أو كلماتك، وشاهد تعليقات الزوار بشكل واضح ومباشر.</p>
</section>

<section class="composer">
  <div class="composer-top">
    <div class="avatar">A</div>
    <div class="composer-main">
      <textarea id="text" placeholder="اكتب ذكرى أو لحظة جميلة من ARABISK…"></textarea>
      <div class="identity"><input id="name" maxlength="80" placeholder="اسمك أو اسم مستعار — اتركه فارغًا ليظهر «مجهول»"></div>
    </div>
  </div>
  <div id="selectedMedia" class="selected-media"><span id="fileName"></span><button id="clearFile" type="button">إزالة</button></div>
  <div class="composer-bottom">
    <div class="publish-tools">
      <label class="media-btn file" title="إضافة صورة"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m4 17 5-5 4 4 2-2 5 5"></path></svg><span>صورة</span><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label>
      <label class="media-btn file" title="إضافة فيديو"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"></rect><path d="m16 10 5-3v10l-5-3z"></path></svg><span>فيديو</span><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"></label>
    </div>
    <div class="publish-tools">
      <span id="message" class="note message"></span>
      <button id="publish" class="publish" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-6 16-3-6-7-2Z"></path><path d="M11 14 20 4"></path></svg><span>نشر الذكرى</span></button>
    </div>
  </div>
</section>

<div class="tabs">
  <button class="pill tab active" data-sort="latest">الأحدث</button>
  <button class="pill tab" data-sort="popular">الأكثر تفاعلًا</button>
</div>

<section id="feed"></section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let sort='latest';

async function api(url,opt={}){
  const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.message||'حدث خطأ');
  return d;
}
function icon(name){
  const map={
    like:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.9c0 5-8.8 10-8.8 10s-8.8-5-8.8-10A4.8 4.8 0 0 1 8 4.2c1.4 0 2.7.6 4 1.9 1.3-1.3 2.6-1.9 4-1.9a4.8 4.8 0 0 1 4.8 4.7Z"></path></svg>',
    comment:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.8 4v-4.2H6.5A2.5 2.5 0 0 1 4 12.5v-7Z"></path></svg>',
    share:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>',
    report:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>'
  };
  return map[name]||'';
}
function initial(name){return (String(name||'مجهول').trim()[0]||'م').toUpperCase()}
function commentHtml(c){
  return '<div class="comment-item"><div class="comment-avatar">'+esc(initial(c.displayName))+'</div><div class="comment-bubble"><div class="comment-author">'+esc(c.displayName||'مجهول')+'</div><div class="comment-text">'+esc(c.text)+'</div><div class="comment-date">'+new Date(c.createdAt).toLocaleString('ar-AE')+'</div></div></div>';
}
function card(m){
  const media=m.mediaType==='image'&&m.imageUrl
    ?'<img class="media" src="'+esc(m.imageUrl)+'" alt="ذكرى ARABISK" loading="lazy">'
    :m.mediaType==='video'&&m.videoUrl
      ?'<div class="video"><video class="media" src="'+esc(m.videoUrl)+'" controls playsinline preload="metadata"></video><button class="play" onclick="this.previousElementSibling.play();this.remove()" aria-label="تشغيل الفيديو">▶</button></div>'
      :'';
  const comments=Array.isArray(m.comments)?m.comments:[];
  const commentList=comments.length?comments.map(commentHtml).join(''):'<div class="no-comments">لا توجد تعليقات بعد — كن أول من يعلق.</div>';
  return '<article class="memory" id="memory-'+esc(m.id)+'">'+
    '<div class="head"><div class="publisher"><div class="mini-avatar">'+esc(initial(m.displayName))+'</div><div><span class="name">'+esc(m.displayName||'مجهول')+'</span><span class="date">'+new Date(m.createdAt).toLocaleString('ar-AE')+'</span></div></div><button class="more" onclick="reportMemory(\''+esc(m.id)+'\')" aria-label="إبلاغ">⋯</button></div>'+
    media+(m.text?'<div class="text">'+esc(m.text)+'</div>':'')+
    '<div class="stats"><span>'+icon('like')+' '+Number(m.likes||0)+' إعجاب</span><span>'+icon('comment')+' '+Number(m.commentsCount||comments.length)+' تعليق</span><span>'+icon('share')+' '+Number(m.shareCount||0)+' مشاركة</span></div>'+
    '<div class="actions">'+
      '<button class="action-btn" onclick="likeMemory(\''+esc(m.id)+'\')">'+icon('like')+'<span>إعجاب</span><b>'+Number(m.likes||0)+'</b></button>'+
      '<button class="action-btn" onclick="focusComment(\''+esc(m.id)+'\')">'+icon('comment')+'<span>تعليق</span><b>'+Number(m.commentsCount||comments.length)+'</b></button>'+
      '<button class="action-btn" onclick="shareMemory(\''+esc(m.id)+'\')">'+icon('share')+'<span>مشاركة</span></button>'+
      '<button class="action-btn" onclick="reportMemory(\''+esc(m.id)+'\')">'+icon('report')+'<span>إبلاغ</span></button>'+
    '</div>'+
    '<div class="comments"><div class="comments-title"><strong>التعليقات</strong><span>'+comments.length+' تعليق ظاهر للجميع</span></div><div class="comment-list">'+commentList+'</div>'+
    '<div class="comment-form"><input id="ci-'+esc(m.id)+'" maxlength="500" placeholder="اكتب تعليقًا…"><button onclick="commentMemory(\''+esc(m.id)+'\')">إرسال</button></div></div>'+
  '</article>';
}
async function load(){
  const f=$('#feed');f.innerHTML='<div class="empty">جارٍ تحميل الذكريات…</div>';
  try{
    const d=await api('/api/memories?sort='+sort);
    f.innerHTML=d.length?d.map(card).join(''):'<div class="empty">لا توجد ذكريات بعد. كن أول من يشارك لحظته.</div>';
    if(location.hash){const el=document.getElementById('memory-'+CSS.escape(location.hash.slice(1)));el?.scrollIntoView({behavior:'smooth',block:'center'})}
  }catch(e){f.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function focusComment(id){const i=$('#ci-'+id);if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'center'})}}
async function likeMemory(id){try{await api('/api/memories/'+id+'/like',{method:'POST'});load()}catch(e){alert(e.message)}}
async function shareMemory(id){
  try{
    const url=location.origin+'/memories#'+id;
    try{await navigator.clipboard.writeText(url)}catch{prompt('انسخ رابط الذكرى:',url)}
    await api('/api/memories/'+id+'/share',{method:'POST'});
    alert('تم نسخ رابط الذكرى.');
  }catch(e){alert(e.message)}
}
async function reportMemory(id){
  const reason=prompt('سبب الإبلاغ؟');if(!reason)return;
  try{await api('/api/memories/'+id+'/report',{method:'POST',body:JSON.stringify({reason})});alert('تم إرسال البلاغ للمراجعة.')}
  catch(e){alert(e.message)}
}
async function commentMemory(id){
  const i=$('#ci-'+id),text=i?.value.trim();if(!text)return;
  try{
    await api('/api/memories/'+id+'/comments',{method:'POST',body:JSON.stringify({text,displayName:$('#name').value.trim()||'مجهول'})});
    i.value='';load();
  }catch(e){alert(e.message)}
}
function selectedFile(){
  return $('#imageFile').files[0]||$('#videoFile').files[0]||null;
}
function updateSelected(){
  const f=selectedFile();
  $('#selectedMedia').classList.toggle('show',!!f);
  $('#fileName').textContent=f?f.name:'';
}
$('#imageFile').addEventListener('change',()=>{$('#videoFile').value='';updateSelected()});
$('#videoFile').addEventListener('change',()=>{$('#imageFile').value='';updateSelected()});
$('#clearFile').addEventListener('click',()=>{$('#imageFile').value='';$('#videoFile').value='';updateSelected()});
$('#publish').addEventListener('click',async()=>{
  const b=$('#publish'),file=selectedFile(),text=$('#text').value.trim(),name=$('#name').value.trim();
  if(!text&&!file)return alert('أضف نصًا أو صورة أو فيديو.');
  b.disabled=true;$('#message').textContent='جاري النشر…';
  try{
    let imageKey='',videoKey='';
    if(file){
      const p=await api('/api/memories/upload',{method:'POST',body:JSON.stringify({fileName:file.name,contentType:file.type,size:file.size})});
      const u=await fetch(p.uploadUrl,{method:'PUT',headers:{'Content-Type':file.type},body:file});
      if(!u.ok)throw Error('فشل رفع الوسائط.');
      if(p.kind==='image')imageKey=p.key;else videoKey=p.key;
    }
    await api('/api/memories',{method:'POST',body:JSON.stringify({text,displayName:name,imageKey,videoKey})});
    $('#text').value='';$('#clearFile').click();$('#message').textContent='تم نشر الذكرى.';
    await load();window.scrollTo({top:420,behavior:'smooth'});
  }catch(e){$('#message').textContent=e.message}
  finally{b.disabled=false}
});
document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));
  x.classList.add('active');sort=x.dataset.sort;load();
}));
load();
</script>
</body>
</html>
