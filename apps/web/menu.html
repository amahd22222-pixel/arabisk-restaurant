<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ARABISK — اكتشف مذاقاتنا"><title>ARABISK — اكتشف مذاقاتنا</title>
<style>
.menu-app{min-height:100vh;background:var(--ar-app-bg)}
.menu-hero{position:relative;overflow:hidden;padding:58px clamp(18px,5vw,64px) 52px;background:linear-gradient(135deg,#1b1510,#2b2118);color:#fff}
.menu-hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:-160px;top:-220px;background:rgba(197,154,91,.10)}
.menu-hero-inner{position:relative;z-index:1;max-width:1240px;margin:auto}
.menu-kicker{margin:0 0 12px;color:var(--ar-app-gold-soft);font-size:10px;font-weight:800;letter-spacing:4px}
.menu-hero h1{margin:0;font:500 clamp(42px,6vw,72px)/1.05 "Playfair Display",serif}
.menu-hero p{max-width:620px;margin:15px 0 0;color:rgba(255,255,255,.68);font-size:12px;line-height:1.9}
.menu-tools{max-width:1240px;margin:-28px auto 0;padding:0 clamp(16px,5vw,44px);position:relative;z-index:3}
.menu-search{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 16px;border:1px solid var(--ar-app-line);border-radius:18px;background:rgba(255,250,242,.97);box-shadow:0 18px 40px rgba(36,26,16,.12)}
.menu-search input{width:100%;height:44px;border:0;outline:0;background:transparent;font:inherit;font-size:12px;color:var(--ar-app-ink)}
.menu-body{max-width:1240px;margin:auto;padding:38px clamp(16px,5vw,44px) 110px}
.menu-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.menu-heading h2{margin:0;font:500 34px/1.1 "Playfair Display",serif}
.menu-heading p{margin:7px 0 0;color:var(--ar-app-muted);font-size:10px}
.menu-count{font-size:10px;color:var(--ar-app-muted);white-space:nowrap}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.category-card{position:relative;display:block;aspect-ratio:1/.92;overflow:hidden;border-radius:22px;background:#211b16;color:#fff;text-decoration:none;box-shadow:0 12px 32px rgba(36,26,16,.07);transition:transform .2s ease,box-shadow .2s ease}
.category-card:hover{transform:translateY(-4px);box-shadow:0 22px 45px rgba(36,26,16,.14)}
.category-image,.category-image img,.category-shade{position:absolute;inset:0;width:100%;height:100%}
.category-image img{object-fit:cover;transition:transform .45s ease}
.category-card:hover img{transform:scale(1.05)}
.category-shade{background:linear-gradient(180deg,rgba(0,0,0,.03) 25%,rgba(0,0,0,.82) 100%)}
.category-copy{position:absolute;inset:auto 17px 16px;z-index:2}
.cat-en{display:block;color:var(--ar-app-gold-soft);font-size:8px;letter-spacing:2px}
.category-copy h3{margin:5px 0 7px;font-size:20px;font-weight:700}
.category-arrow{font-size:9px;color:rgba(255,255,255,.74)}
.empty-menu{grid-column:1/-1;text-align:center;padding:45px 20px;border:1px dashed var(--ar-app-line);border-radius:20px;color:var(--ar-app-muted);font-size:11px;background:var(--ar-app-paper)}
@media(max-width:1000px){.category-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.menu-hero{padding:42px 18px 48px}.menu-tools{padding:0 14px}.menu-body{padding:32px 14px 105px}.category-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.category-grid{grid-template-columns:1fr 1fr;gap:10px}.category-card{border-radius:17px}.category-copy{inset:auto 13px 13px}.category-copy h3{font-size:16px}.menu-heading h2{font-size:29px}.menu-count{display:none}}
</style>
</head>
<body>
<header class="nav"><div class="brand">ARABISK<span>RESTAURANT & CAFE</span></div><nav><a href="/">الرئيسية</a><a href="/menu">استكشف المنيو</a><a href="/events">الفعاليات</a><a href="/reservation">حجز طاولة</a><a href="/#about">عن المطعم</a><a href="/#contact">تواصل معنا</a></nav><a class="lang" href="/menu">AR</a></header>
<main class="menu-app">
<section class="menu-hero"><div class="menu-hero-inner"><p class="menu-kicker">ARABISK MENU</p><h1>اكتشف مذاقاتنا</h1><p>اختر تجربتك من الأقسام التالية. كل قسم يقودك مباشرة إلى قائمته، بدون تشتيت.</p></div></section>
<div class="menu-tools"><label class="menu-search"><span aria-hidden="true">⌕</span><input id="category-search" type="search" placeholder="ابحث عن قسم…" autocomplete="off"></label></div>
<section class="menu-body"><div class="menu-heading"><div><h2>اختر القسم</h2><p>قائمة مرتبة حسب تجربة الطعام</p></div><span id="category-count" class="menu-count"></span></div><div id="category-view" class="category-grid" aria-live="polite"></div></section>
</main>
<footer id="contact"><strong>ARABISK</strong><span>Restaurant & Cafe</span><small>© 2026 ARABISK. All rights reserved.</small></footer>
<script src="/cart.js?v=20260920.8" defer></script>
<script>
const images={Breakfast:'https://images.unsplash.com/photo-1570882716056-9b4919acaf51?auto=format&fit=crop&w=900&q=72',Manakish:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=72','Cold Appetizers':'https://images.unsplash.com/photo-1577805947697-89e18249d767?auto=format&fit=crop&w=900&q=72','Hot Appetizers':'https://images.unsplash.com/photo-1623653387945-2fd25214f8fc?auto=format&fit=crop&w=900&q=72',Salads:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=72',Soups:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=72',Sandwich:'https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=900&q=72',Pizza:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=72',Pasta:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=900&q=72','Main Course':'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=72','Mixed Grill':'https://images.unsplash.com/photo-1633857471930-bfa8d0be5e4a?auto=format&fit=crop&w=900&q=72','Mixed Taste':'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=72',Desserts:'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=900&q=72','Cheese Cake':'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=900&q=72','Arabisk Ice Cream':'https://images.unsplash.com/photo-1497032205916-ac775f0649ae?auto=format&fit=crop&w=900&q=72','Cocktail & Refreshing Drinks':'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=900&q=72','Energy Drinks':'https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=72',Juices:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=900&q=72',Mojitos:'https://images.unsplash.com/photo-1568926825354-c277ddca9bec?auto=format&fit=crop&w=900&q=72','Milk Shakes':'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=900&q=72',Tea:'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=900&q=72',Coffee:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=72',Latte:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=900&q=72','Soft Drinks':'https://images.unsplash.com/photo-1543253687-c4b3b9c1aa8d?auto=format&fit=crop&w=900&q=72','Drinking Water':'https://images.unsplash.com/photo-1560023907-5f339617ea30?auto=format&fit=crop&w=900&q=72',Sheesha:'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=900&q=72'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slug=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const root=document.querySelector('#category-view'),search=document.querySelector('#category-search'),count=document.querySelector('#category-count');let list=[];
const MENU_CACHE_KEY='arabisk-menu-cache-v2';const MENU_CACHE_TTL=30000;
function readMenuCache(){try{const value=JSON.parse(sessionStorage.getItem(MENU_CACHE_KEY)||'null');return value&&value.savedAt&&Date.now()-value.savedAt<MENU_CACHE_TTL&&Array.isArray(value.categories)?value.categories:null}catch{return null}}
function writeMenuCache(categories){try{sessionStorage.setItem(MENU_CACHE_KEY,JSON.stringify({savedAt:Date.now(),categories}))}catch{}}
function render(){const q=search.value.trim().toLowerCase();const visible=q?list.filter(c=>`${c.nameAr||''} ${c.nameEn||''}`.toLowerCase().includes(q)):list;count.textContent=`${visible.length} قسم`;root.innerHTML=visible.map(c=>{const image=c.imageUrl||images[c.nameEn]||'';return `<a class="category-card" href="/menu/${slug(c.id)}"><div class="category-image">${image?`<img src="${esc(image)}" alt="${esc(c.nameAr||c.nameEn)}" loading="lazy" onerror="this.style.display='none'">`:''}</div><span class="category-shade"></span><div class="category-copy"><span class="cat-en">${esc(c.nameEn)}</span><h3>${esc(c.nameAr||c.nameEn)}</h3><span class="category-arrow">اكتشف القسم ←</span></div></a>`}).join('')||'<p class="empty-menu">لا يوجد قسم يطابق البحث.</p>'}
(async()=>{try{const cached=readMenuCache();if(cached){list=cached.filter(c=>c.active!==false).sort((a,b)=>(Number(a.sortOrder)||9999)-(Number(b.sortOrder)||9999));render();search.addEventListener('input',render);return}const r=await fetch('/api/categories',{cache:'no-store'});if(!r.ok)throw new Error();const categories=await r.json();writeMenuCache(categories);list=categories.filter(c=>c.active!==false).sort((a,b)=>(Number(a.sortOrder)||9999)-(Number(b.sortOrder)||9999));render();search.addEventListener('input',render)}catch(e){root.innerHTML='<p class="empty-menu">تعذر تحميل الأقسام حاليًا.</p>';console.error(e)}})();
</script>
</body></html>
