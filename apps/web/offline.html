<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>ARABISK — بدون اتصال</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17130f;color:#f4ead7;font-family:Cairo,Arial,sans-serif;padding:24px;text-align:center}.card{width:min(520px,100%);padding:42px 28px;border:1px solid #5b4a34;border-radius:24px;background:#211a14;box-shadow:0 24px 70px #0006}.mark{width:82px;height:82px;margin:0 auto 24px;border:2px solid #e6c991;border-radius:50%;display:grid;place-items:center;font:700 38px Georgia,serif;color:#e6c991}.eyebrow{color:#e6c991;letter-spacing:4px;font-size:11px}.title{font:500 34px/1.2 Georgia,serif;margin:12px 0}.copy{color:#c9c0b3;line-height:1.9;font-size:14px}.button{margin-top:24px;border:1px solid #e6c991;background:#c59a5b;color:#fff;padding:13px 24px;border-radius:999px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<div class="mark">A</div>
<div class="eyebrow">ARABISK</div>
<h1 class="title">أنت غير متصل بالإنترنت</h1>
<p class="copy">يمكنك العودة إلى الصفحات التي تم تحميلها سابقًا، أو المحاولة مرة أخرى عند عودة الاتصال.</p>
<button class="button" onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
