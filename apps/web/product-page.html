<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ARABISK — تفاصيل المنتج"><title>ARABISK — المنتج</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#14120f;--black:#0b0b0b;--gold:#b89455;--gold2:#d8bb7c;--cream:#f5efe4;--paper:#fffdf8;--muted:#7c7468;--line:#ded6c8;--green:#2d8a57;--danger:#a3432d;--shadow:0 18px 50px rgba(25,20,12,.08)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font-family:Cairo,sans-serif}.nav{height:80px;background:var(--black);color:#fff;display:flex;align-items:center;padding:0 6vw;gap:34px;position:sticky;top:0;z-index:20}.brand{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:3px}.brand span{display:block;font-family:Cairo;font-size:8px;letter-spacing:2px;color:var(--gold2);margin-top:7px}.nav nav{display:flex;gap:24px;margin:auto}.nav a{color:#eee;text-decoration:none;font-size:14px}.nav a:hover{color:var(--gold2)}.lang{display:inline-flex;align-items:center;justify-content:center;border:1px solid #6f624f;border-radius:50%;width:38px;height:38px;color:#fff;text-decoration:none}.wrap{max-width:1240px;margin:0 auto;padding:44px 5vw 90px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink);border:1px solid var(--line);background:var(--paper);padding:9px 17px;border-radius:999px;text-decoration:none;margin-bottom:24px}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px}.visual,.panel,.detail-card,.related-card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.visual{overflow:hidden}.hero-image{height:560px;background:#ebe3d7 center/cover no-repeat;position:relative}.hero-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(0,0,0,.5));pointer-events:none}.badges{position:absolute;top:18px;right:18px;display:flex;gap:7px;flex-wrap:wrap;z-index:2}.badges span{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;color:#71552e}.badges .hot{color:var(--danger);background:#fff6f2}.gallery{display:flex;gap:9px;padding:12px;overflow:auto}.thumb{width:72px;height:72px;flex:0 0 72px;border:1px solid var(--line);background:center/cover no-repeat;cursor:pointer}.thumb.active{border:2px solid var(--gold)}.panel{padding:38px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;margin:0 0 12px}.panel h1{font-family:'Playfair Display',serif;font-size:clamp(42px,5vw,68px);font-weight:500;line-height:1.05;margin:0 0 7px}.en{color:var(--muted);font-size:14px;margin:0 0 18px}.description{color:#5e584f;line-height:2;font-size:14px}.smart{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.smart span{padding:6px 10px;border:1px solid #d8c29b;border-radius:999px;background:#fffaf0;color:#805f2c;font-size:10px}.smart .hot{color:var(--danger);border-color:#e8c8bd;background:#fff6f2}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.fact{border:1px solid var(--line);background:#fff;padding:12px}.fact small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.fact strong{font-size:12px}.price-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.price{font-family:'Playfair Display',serif;font-size:32px;color:var(--gold);direction:ltr}.available{padding:6px 12px;border-radius:999px;border:1px solid #cae1d4;background:#f7fbf8;color:var(--green);font-size:11px}.purchase{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.qty{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px}.qty button{width:36px;height:36px;border:0;border-radius:50%;background:var(--cream);font-size:18px;cursor:pointer}.qty span{min-width:24px;text-align:center;font-weight:700}.add{flex:1;min-width:190px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}.add:hover{background:var(--gold)}.share{border:1px solid var(--line);border-radius:999px;background:#fff;padding:12px 18px;font:inherit;cursor:pointer}.feedback{min-height:22px;margin:10px 0 0;color:var(--gold);font-size:12px}.section{margin-top:52px}.section h2{font-family:'Playfair Display',serif;font-size:32px;font-weight:500;margin:0}.section-lead{color:var(--muted);font-size:12px;margin:6px 0 18px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.detail-card{padding:20px}.detail-card h3{font-size:14px;margin:0 0 8px}.detail-card p{margin:0;color:#5e584f;line-height:2;font-size:12px}.allergens{display:flex;gap:7px;flex-wrap:wrap}.allergens span{padding:6px 9px;border:1px solid #e2c8bf;background:#fff6f2;color:#8d4a35;border-radius:999px;font-size:10px}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related-card{overflow:hidden}.related-image{height:180px;background:#ebe3d7 center/cover no-repeat}.related-body{padding:15px}.related-body h3{font-size:15px;margin:0 0 6px}.related-body p{font-size:11px;color:var(--gold);margin:0}.related-link{display:block;color:inherit;text-decoration:none}.status{max-width:700px;margin:70px auto;text-align:center;color:var(--muted);padding:50px 20px;background:var(--paper);border:1px dashed var(--line)}.error{color:var(--danger)}footer{background:#080808;color:#fff;padding:50px 8vw;display:flex;gap:15px;align-items:center}footer strong{font-family:'Playfair Display';font-size:28px}footer span{color:var(--gold2)}footer small{margin-right:auto;color:#777}@media(max-width:900px){.nav{padding:0 20px}.nav nav{display:none}.layout{grid-template-columns:1fr}.hero-image{height:460px}.panel{padding:28px}.detail-grid,.related{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:32px 16px 70px}.hero-image{height:330px}.panel h1{font-size:44px}.facts,.detail-grid,.related{grid-template-columns:1fr}.purchase{align-items:stretch}.add,.share{width:100%;min-width:0}.qty{justify-content:center}}
</style>
</head>
<body>
<header class="nav"><div class="brand">ARABISK<span>RESTAURANT & CAFE</span></div><nav><a href="/">الرئيسية</a><a href="/menu">استكشف المنيو</a><a href="/order-tracking">تتبع الطلب</a><a href="/reservation">حجز طاولة</a><a href="/#about">عن المطعم</a></nav><a class="lang" href="/menu">AR</a></header>
<main class="wrap"><a id="back" class="back" href="/menu">← العودة للقسم</a><div id="loading" class="status">جاري تحميل المنتج…</div><section id="product" hidden><div class="layout"><div class="visual"><div id="hero-image" class="hero-image"><div id="badges-image" class="badges"></div></div><div id="gallery" class="gallery" hidden></div></div><div class="panel"><p id="category" class="eyebrow">MENU</p><h1 id="name-ar">المنتج</h1><p id="name-en" class="en"></p><p id="description" class="description"></p><div id="badges" class="smart"></div><div id="facts" class="facts" hidden></div><div class="price-row"><strong id="price" class="price">AED 0</strong><span id="availability" class="available">متوفر</span></div><div class="purchase"><div class="qty"><button id="minus" type="button" aria-label="تقليل الكمية">−</button><span id="quantity">1</span><button id="plus" type="button" aria-label="زيادة الكمية">+</button></div><button id="add" class="add" type="button">أضف إلى طلبك</button><button id="share" class="share" type="button">مشاركة الطبق</button></div><p id="feedback" class="feedback"></p></div></div><section id="details-section" class="section" hidden><h2>تفاصيل الطبق</h2><p class="section-lead">المعلومات المتاحة لهذا الصنف قبل الطلب.</p><div id="details" class="detail-grid"></div></section><section class="section"><h2>أصناف قد تعجبك</h2><p class="section-lead">خيارات أخرى من نفس القسم.</p><div id="related" class="related"></div></section></section></main>
<footer><strong>ARABISK</strong><span>Restaurant & Cafe</span><small>© 2026 ARABISK. All rights reserved.</small></footer>
<script type="module" src="./cart.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slug=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const api=async(url)=>{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()};
const pathParts=decodeURIComponent(location.pathname.replace(/\/$/,'')).split('/');
const categoryKey=pathParts[2]||'';const productKey=pathParts[3]||'';
const loading=document.querySelector('#loading'),root=document.querySelector('#product'),feedback=document.querySelector('#feedback');let current=null,qty=1;
const money=value=>`AED ${Number(value||0).toFixed(0)}`;
function setQuantity(delta){qty=Math.max(1,Math.min(20,qty+delta));document.querySelector('#quantity').textContent=String(qty)}
function renderBadges(product){const s=product.smart||{};const out=[];if(s.popular)out.push('<span>🔥 الأكثر طلبًا</span>');if(s.isNew)out.push('<span>جديد</span>');if(s.chefChoice)out.push('<span>اختيار الشيف</span>');if(s.vegetarian)out.push('<span>نباتي</span>');if(s.vegan)out.push('<span>نباتي بالكامل</span>');if(s.glutenFree)out.push('<span>بدون جلوتين</span>');if(s.spicy)out.push(`<span class="hot">🌶️ حار${Number(s.spiceLevel)>1?' — '+('★'.repeat(Number(s.spiceLevel)):''}</span>`);document.querySelector('#badges').innerHTML=out.join('');document.querySelector('#badges-image').innerHTML=out.slice(0,3).join('')}
function renderFacts(product){const s=product.smart||{};const facts=[];if(product.portion||product.size||product.serving)facts.push(`<div class="fact"><small>الحجم / الحصة</small><strong>${esc(product.portion||product.size||product.serving)}</strong></div>`);if(Number(s.spiceLevel)>0)facts.push(`<div class="fact"><small>مستوى الحِدة</small><strong>${'🌶️'.repeat(Number(s.spiceLevel))}</strong></div>`);const dietary=Array.isArray(product.dietary)?product.dietary:(Array.isArray(s.dietary)?s.dietary:[]);if(dietary.length)facts.push(`<div class="fact"><small>الخيارات الغذائية</small><strong>${dietary.map(esc).join(' · ')}</strong></div>`);const node=document.querySelector('#facts');node.innerHTML=facts.join('');node.hidden=facts.length===0}
function renderDetails(product){const details=[];const ingredients=product.ingredientsAr||product.ingredients||'';const allergens=Array.isArray(product.allergens)?product.allergens:[];const notes=product.notesAr||product.notes||'';if(ingredients)details.push(`<article class="detail-card"><h3>المكونات</h3><p>${esc(ingredients)}</p></article>`);if(allergens.length)details.push(`<article class="detail-card"><h3>الحساسية الغذائية</h3><div class="allergens">${allergens.map(item=>`<span>${esc(item)}</span>`).join('')}</div></article>`);if(notes)details.push(`<article class="detail-card"><h3>ملاحظات</h3><p>${esc(notes)}</p></article>`);const section=document.querySelector('#details-section');document.querySelector('#details').innerHTML=details.join('');section.hidden=!details.length}
function renderGallery(product){const urls=[product.imageUrl,...(Array.isArray(product.gallery)?product.gallery:[])].filter(Boolean);const unique=[...new Set(urls)];const gallery=document.querySelector('#gallery');if(unique.length<2){gallery.hidden=true;return}gallery.hidden=false;gallery.innerHTML=unique.map((url,index)=>`<button class="thumb${index===0?' active':''}" type="button" data-image="${esc(url)}" style="background-image:url('${esc(url)}')" aria-label="صورة ${index+1}"></button>`).join('');gallery.querySelectorAll('[data-image]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#hero-image').style.backgroundImage=`url('${esc(button.dataset.image)}')`;gallery.querySelectorAll('.thumb').forEach(item=>item.classList.toggle('active',item===button))}))}
function renderRelated(category,items,product){const related=items.filter(item=>item.id!==product.id&&item.available!==false).slice(0,6);document.querySelector('#related').innerHTML=related.map(item=>`<a class="related-card related-link" href="/menu/${slug(category.id)}/${slug(item.nameEn||item.nameAr)}"><div class="related-image" style="background-image:url('${esc(item.imageUrl||'')}')"></div><div class="related-body"><h3>${esc(item.nameAr||item.nameEn)}</h3><p>${money(item.price)}</p></div></a>`).join('')||'<p class="section-lead">لا توجد أصناف أخرى في هذا القسم حاليًا.</p>'}
async function load(){try{if(!categoryKey||!productKey)throw new Error('invalid route');const [categories,products]=await Promise.all([api('/api/categories'),api('/api/products')]);const category=categories.find(item=>slug(item.id)===categoryKey);if(!category)throw new Error('category not found');const items=products.filter(item=>item.categoryId===category.id&&item.available!==false);const product=items.find(item=>slug(item.nameEn||item.nameAr)===productKey||slug(item.id)===productKey);if(!product)throw new Error('product not found');let details={};try{details=await api(`/api/product-details/${encodeURIComponent(product.id)}`)}catch(error){console.warn('Product details unavailable:',error.message)}current={...product,...details};document.title=`${current.nameAr||current.nameEn} — ARABISK`;document.querySelector('#back').href=`/menu/${slug(category.id)}`;document.querySelector('#category').textContent=(category.nameEn||'MENU').toUpperCase();document.querySelector('#name-ar').textContent=current.nameAr||current.nameEn;document.querySelector('#name-en').textContent=current.nameEn||'';document.querySelector('#description').textContent=current.descriptionAr||current.descriptionEn||'اختيار مميز من قائمة ARABISK.';document.querySelector('#price').textContent=money(current.price);document.querySelector('#availability').textContent=current.available===false?'غير متوفر':'متوفر';const hero=document.querySelector('#hero-image');hero.style.backgroundImage=current.imageUrl?`url('${esc(current.imageUrl)}')`:'';renderBadges(current);renderFacts(current);renderDetails(current);renderGallery(current);renderRelated(category,items,current);document.querySelector('#minus').onclick=()=>setQuantity(-1);document.querySelector('#plus').onclick=()=>setQuantity(1);document.querySelector('#add').onclick=()=>{if(!window.ARABISK_CART?.add){feedback.textContent='السلة غير متاحة حاليًا، يرجى إعادة تحميل الصفحة.';return}window.ARABISK_CART.add(current,qty);feedback.textContent=`تمت إضافة ${qty} × ${current.nameAr||current.nameEn} إلى طلبك.`;qty=1;document.querySelector('#quantity').textContent='1';setTimeout(()=>feedback.textContent='',2200)};document.querySelector('#share').onclick=async()=>{try{if(navigator.share){await navigator.share({title:current.nameAr||current.nameEn,text:current.descriptionAr||'',url:location.href})}else{await navigator.clipboard.writeText(location.href);feedback.textContent='تم نسخ رابط الطبق.';setTimeout(()=>feedback.textContent='',1800)}}catch{}};loading.hidden=true;root.hidden=false}catch(error){console.error('ARABISK product page:',error);loading.classList.add('error');loading.textContent='تعذر تحميل المنتج حاليًا. جرّب العودة إلى القسم ثم فتح المنتج مرة أخرى.'}}
load();
</script>
</body>
</html>
