<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ARABISK — تتبع طلبك">
<title>ARABISK — تتبع الطلب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#14120f;--black:#0b0b0b;--gold:#b89455;--gold2:#d8bb7c;--cream:#f5efe4;--paper:#fffdf8;--muted:#7c7468;--line:#ded6c8;--danger:#a3432d;--green:#2d8a57;--shadow:0 18px 50px rgba(25,20,12,.08)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font-family:Cairo,sans-serif}.nav{height:80px;background:var(--black);color:#fff;display:flex;align-items:center;padding:0 6vw;gap:34px}.brand{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:3px;line-height:1}.brand span{display:block;font-family:Cairo;font-size:8px;letter-spacing:2px;color:var(--gold2);margin-top:7px}.nav nav{display:flex;gap:26px;margin:auto}.nav a{color:#eee;text-decoration:none;font-size:14px}.nav a:hover{color:var(--gold2)}.lang{display:inline-flex;align-items:center;justify-content:center;border:1px solid #6f624f;background:none;color:#fff;border-radius:50%;width:38px;height:38px;text-decoration:none}.page{max-width:1040px;margin:0 auto;padding:74px 20px 100px}.head{text-align:center;max-width:720px;margin:0 auto 36px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;margin:0 0 12px}.head h1{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,66px);font-weight:500;margin:0 0 12px}.head p{color:var(--muted);line-height:2;margin:0}.card{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:30px;max-width:720px;margin:0 auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px}.form .full{grid-column:1/-1}.form input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.form input:focus{outline:2px solid rgba(184,148,85,.18);border-color:var(--gold)}.submit,.refresh,.back{border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.submit{background:var(--ink);color:#fff}.submit:disabled{opacity:.6;cursor:wait}.message{min-height:22px;color:var(--danger);font-size:12px;margin:0}.result{margin-top:22px}.result-head{display:flex;align-items:start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.result-head h2{font-family:'Playfair Display',serif;font-size:30px;margin:0}.state{margin-top:16px;border:1px solid var(--line);background:#fff8ed;border-radius:14px;padding:15px}.state strong{display:block;color:#8e6f38;font-size:17px}.state span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.updated{display:block;color:var(--muted);font-size:10px;margin-top:8px}.timeline{display:grid;gap:9px;margin:20px 0}.step{display:flex;align-items:center;gap:11px;border:1px solid #eee7da;background:#fff;border-radius:12px;padding:11px 12px}.step>span{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eee7da;color:#777;font-weight:700;font-size:12px}.step strong{display:block;font-size:12px}.step small{display:block;color:#999;font-size:10px;margin-top:2px}.step.done>span,.step.active>span{background:var(--gold);color:#fff}.step.active{border-color:#d2b16d}.step.cancelled{border-color:#e0b8ae;background:#fff7f5}.step.cancelled>span{background:var(--danger);color:#fff}.items{display:grid;gap:0;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #eee7da}.item strong{font-size:12px}.item small{color:#8e6f38}.summary{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:16px}.summary strong{font-family:'Playfair Display',serif;color:var(--gold);font-size:25px}.actions{display:flex;gap:10px}.refresh{border:1px solid var(--line);background:#fff}.back{background:var(--ink);color:#fff;text-decoration:none;display:inline-flex}.empty{text-align:center;color:var(--muted);padding:18px}.meta-note{color:var(--muted);font-size:11px;margin:8px 0 0}@media(max-width:760px){.nav{padding:0 20px}.nav nav{display:none}.page{padding:52px 16px 70px}.card{padding:22px}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.result-head,.summary{flex-direction:column;align-items:stretch}.actions{flex-direction:column}.actions>*{width:100%;justify-content:center}}
</style>
</head>
<body>
<header class="nav"><div class="brand">ARABISK<span>RESTAURANT & CAFE</span></div><nav><a href="/">الرئيسية</a><a href="/menu">استكشف المنيو</a><a href="/order-tracking">تتبع الطلب</a><a href="/reservation">حجز طاولة</a><a href="/#about">عن المطعم</a></nav><a class="lang" href="/order-tracking">AR</a></header>
<main class="page">
  <section class="head"><p class="eyebrow">ARABISK TRACKING</p><h1>تابع طلبك</h1><p>أدخل رقم الطلب ورقم الهاتف المستخدم عند الطلب لمعرفة آخر حالة. يتم تحديث الحالة تلقائيًا أثناء تجهيز طلبك.</p></section>
  <section class="card">
    <form id="tracking-form" class="form">
      <label>رقم الطلب<input id="order-id" maxlength="20" placeholder="مثال: O00012" autocomplete="off" required></label>
      <label>رقم الهاتف<input id="phone" maxlength="40" inputmode="tel" autocomplete="tel" required></label>
      <button class="submit full" type="submit">عرض حالة الطلب</button>
      <p id="message" class="message full" role="status" aria-live="polite"></p>
    </form>
    <section id="result" class="result" hidden>
      <div class="result-head"><div><p class="eyebrow">ORDER</p><h2 id="result-title">طلب —</h2><p id="result-note" class="meta-note"></p></div><span id="updated" class="updated"></span></div>
      <div id="state" class="state"><strong>حالة الطلب</strong><span>—</span></div>
      <div id="timeline" class="timeline"></div>
      <div id="items" class="items"></div>
      <div class="summary"><strong id="total">AED 0</strong><div class="actions"><button id="refresh" class="refresh" type="button">تحديث الآن</button><a class="back" href="/menu">العودة إلى المنيو</a></div></div>
    </section>
  </section>
</main>
<script>
const lastKey='arabisk-last-order-v1',checkoutKey='arabisk-checkout-v1';
const statusMeta={pending:{label:'تم استلام الطلب',step:1},confirmed:{label:'تم تأكيد الطلب',step:2},preparing:{label:'جاري التحضير',step:3},ready:{label:'الطلب جاهز',step:4},completed:{label:'تم إكمال الطلب',step:5},cancelled:{label:'تم إلغاء الطلب',step:0}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const readJson=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch{return fallback}};
const last=readJson(lastKey,null),checkout=readJson(checkoutKey,{}),params=new URLSearchParams(location.search);
const idEl=document.querySelector('#order-id'),phoneEl=document.querySelector('#phone'),form=document.querySelector('#tracking-form'),submit=form.querySelector('.submit'),message=document.querySelector('#message'),result=document.querySelector('#result'),timer={id:null};
if(idEl)idEl.value=params.get('order')||last?.id||'';if(phoneEl)phoneEl.value=checkout?.phone||last?.phone||'';
function render(data){const meta=statusMeta[data.status]||{label:'حالة الطلب غير معروفة',step:0};document.querySelector('#result-title').textContent=`طلب ${data.id||'—'}`;document.querySelector('#result-note').textContent=data.orderType==='dine_in'?(data.tableNumber?`داخل المطعم — الطاولة ${data.tableNumber}`:'داخل المطعم'):'استلام من المطعم';document.querySelector('#state').innerHTML=`<strong>${esc(meta.label)}</strong><span>${data.status==='cancelled'?'تعذر إكمال الطلب.':'سيتم تحديث الحالة تلقائيًا أثناء تجهيز الطلب.'}</span>`;document.querySelector('#updated').textContent=data.updatedAt?`آخر تحديث: ${new Date(data.updatedAt).toLocaleString('ar-AE',{dateStyle:'medium',timeStyle:'short'})}`:'';const steps=[['pending','استلام الطلب'],['confirmed','تأكيد الطلب'],['preparing','التحضير'],['ready','جاهز للاستلام'],['completed','مكتمل']];document.querySelector('#timeline').innerHTML=steps.map(([key,label],i)=>{const done=data.status!=='cancelled'&&meta.step>=i+1;const active=data.status===key;return `<div class="step ${done?'done':''} ${active?'active':''}"><span>${done?'✓':i+1}</span><div><strong>${label}</strong><small>${active?'الحالة الحالية':done?'تم':'بانتظار التحديث'}</small></div></div>`}).join('')+(data.status==='cancelled'?'<div class="step cancelled active"><span>!</span><div><strong>تم إلغاء الطلب</strong><small>يرجى التواصل مع المطعم عند الحاجة.</small></div></div>':'');const items=Array.isArray(data.items)?data.items:[];document.querySelector('#items').innerHTML=items.length?items.map(item=>`<div class="item"><strong>${esc(item.nameAr||item.nameEn||'صنف')} × ${Number(item.quantity||0)}</strong><small>AED ${Number(item.lineTotal??(Number(item.unitPrice||0)*Number(item.quantity||0))).toFixed(0)}</small></div>`).join(''):'<div class="empty">لا توجد تفاصيل أصناف لهذا الطلب.</div>';document.querySelector('#total').textContent=`AED ${Number(data.total||0).toFixed(0)}`;result.hidden=false;message.textContent='';localStorage.setItem(lastKey,JSON.stringify({id:String(data.id),phone:String(phoneEl.value).slice(0,40),total:Number(data.total||0),status:String(data.status||'pending'),updatedAt:data.updatedAt||new Date().toISOString()}));}
async function lookup(showMessage=true){const orderId=idEl.value.trim().toUpperCase(),phone=phoneEl.value.trim();if(!/^O\d{5}$/.test(orderId)||phone.length<5){if(showMessage)message.textContent='أدخل رقم الطلب ورقم الهاتف المستخدم عند الطلب.';result.hidden=true;return false}submit.disabled=true;if(showMessage)message.textContent='جاري تحديث حالة الطلب…';try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);let response;try{response=await fetch('/api/orders/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId,phone}),signal:controller.signal})}finally{clearTimeout(timeout)}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'تعذر العثور على الطلب.');render(data);return true}catch(error){if(showMessage)message.textContent=error.name==='AbortError'?'انتهت مهلة الاتصال. حاول مرة أخرى.':error.message||'تعذر تحديث حالة الطلب.';return false}finally{submit.disabled=false}}
function startPolling(){clearInterval(timer.id);timer.id=setInterval(()=>{if(!result.hidden)void lookup(false)},20000)}
form.addEventListener('submit',e=>{e.preventDefault();void lookup(true)});document.querySelector('#refresh').onclick=()=>void lookup(true);startPolling();if(idEl.value&&phoneEl.value)void lookup(true);
</script>
</body>
</html>
