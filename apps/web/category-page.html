<style>body{background:var(--app-bg);color:var(--app-ink);font-family:Cairo,sans-serif}.category-page-head{padding:72px 8vw 36px;background:var(--app-paper);border-bottom:1px solid var(--app-line)}.back-btn{display:inline-block;color:var(--app-ink);border:1px solid var(--app-line);padding:9px 18px;border-radius:999px;text-decoration:none;margin-bottom:28px}.back-btn:hover{border-color:var(--app-gold);color:var(--app-gold)}.eyebrow{color:var(--app-gold);font-size:11px;letter-spacing:4px;margin:0 0 14px}.category-page-head h1{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,68px);font-weight:500;line-height:1.05;margin:0 0 12px}.category-page-head p:last-child{color:var(--app-muted);line-height:1.9;margin:0;max-width:680px}.category-page-body{padding:34px 8vw 100px;background:var(--app-paper);min-height:calc(100vh - 360px)}.toolbar{display:grid;gap:18px;margin-bottom:28px}.toolbar-top{display:flex;align-items:center;justify-content:space-between;gap:18px}.search{width:min(520px,100%)}.search input{width:100%;height:46px;border:1px solid var(--app-line);border-radius:999px;background:#fff;padding:0 18px;font:inherit;color:var(--app-ink);outline:none}.search input:focus{border-color:var(--app-gold)}.result-count{color:var(--app-muted);font-size:12px;white-space:nowrap}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--app-line);background:#fff;padding:8px 14px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;color:var(--app-ink)}.chip.active{background:var(--app-ink);border-color:var(--app-ink);color:#fff}.smart-filters{display:flex;gap:8px;flex-wrap:wrap}.sort{display:flex;align-items:center;gap:9px;color:var(--app-muted);font-size:12px}.sort select{border:1px solid var(--app-line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item{background:var(--app-bg);border:1px solid var(--app-line);padding:25px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.15s}.item:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.05)}.item-link{color:inherit;text-decoration:none}.item-thumb{height:185px;margin:-25px -25px 18px;background-size:cover;background-position:center;background-color:#ebe4d8}.item .cat{font-size:10px;color:var(--app-gold);letter-spacing:2px}.item h3{font-size:18px;margin:10px 0}.item p{color:var(--app-muted);font-size:12px;margin:0;line-height:1.8}.smart-badges{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.smart-badges span{display:inline-flex;border:1px solid #d8c29b;border-radius:999px;padding:4px 8px;font-size:10px;background:#fffaf0;color:#805f2c}.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.price{font-family:'Playfair Display',serif;color:var(--app-gold);font-size:24px;direction:ltr;text-align:left}.item-actions{display:flex;align-items:center;gap:8px}.item-open{font-size:12px;color:var(--app-gold);font-weight:600;text-decoration:none}.add-btn{border:0;border-radius:999px;background:var(--app-ink);color:#fff;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.add-btn:hover{background:var(--app-gold)}.empty-menu{text-align:center;grid-column:1/-1;color:var(--app-muted);padding:35px}.menu-loading{height:170px;border:1px solid var(--app-line);background:linear-gradient(90deg,#f3eee5 25%,#fbf8f2 50%,#f3eee5 75%);background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.category-page-head,.category-page-body{padding-left:20px;padding-right:20px}.category-page-head{padding-top:52px}.grid{grid-template-columns:1fr}.toolbar-top{align-items:stretch;flex-direction:column}.sort{justify-content:space-between}}@media(max-width:520px){.category-page-head h1{font-size:44px}.item-actions{flex-direction:column;align-items:flex-end}.chips,.smart-filters{overflow:auto;flex-wrap:nowrap;padding-bottom:4px}.chip{white-space:nowrap}}</style>
