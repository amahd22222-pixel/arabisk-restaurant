<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ARABISK — أصناف القسم"><title>ARABISK — القسم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#111;--black:#0d0d0d;--gold:#b89455;--gold2:#d2b16d;--cream:#f6f1e7;--paper:#fffdf8;--muted:#817a6e;--line:#ded6c8}*{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font-family:Cairo,sans-serif}.nav{height:82px;background:var(--black);color:#fff;display:flex;align-items:center;padding:0 6vw;gap:42px;position:sticky;top:0;z-index:10}.brand{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:3px;line-height:1}.brand span{display:block;font-family:Cairo;font-size:8px;letter-spacing:2px;color:var(--gold2);margin-top:7px}.nav nav{display:flex;gap:28px;margin:auto}.nav a{color:#eee;text-decoration:none;font-size:14px}.nav a:hover{color:var(--gold2)}.lang{display:inline-flex;align-items:center;justify-content:center;border:1px solid #6f624f;background:none;color:#fff;border-radius:50%;width:38px;height:38px;text-decoration:none}.category-page-head{padding:72px 8vw 36px;background:var(--paper);border-bottom:1px solid var(--line)}.back-btn{display:inline-block;color:var(--ink);border:1px solid var(--line);padding:9px 18px;border-radius:999px;text-decoration:none;margin-bottom:28px}.back-btn:hover{border-color:var(--gold);color:var(--gold)}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;margin:0 0 14px}.category-page-head h1{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,68px);font-weight:500;line-height:1.05;margin:0 0 12px}.category-page-head p:last-child{color:var(--muted);line-height:1.9;margin:0;max-width:680px}.category-page-body{padding:38px 8vw 100px;background:var(--paper);min-height:calc(100vh - 360px)}.detail-head{display:flex;align-items:center;justify-content:flex-start;margin-bottom:28px}.search{width:min(440px,100%)}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 16px;font:inherit;color:var(--ink);outline:none}.search input:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item{background:var(--cream);border:1px solid var(--line);padding:25px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.15s}.item:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.05)}.item-link{color:inherit;text-decoration:none}.item-thumb{height:185px;margin:-25px -25px 18px;background-size:cover;background-position:center}.item .cat{font-size:10px;color:var(--gold);letter-spacing:2px}.item h3{font-size:18px;margin:10px 0}.item p{color:var(--muted);font-size:12px;margin:0;line-height:1.8}.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.price{font-family:'Playfair Display',serif;color:var(--gold);font-size:24px;direction:ltr;text-align:left}.item-open{font-size:12px;color:var(--gold);font-weight:600}.empty-menu{text-align:center;grid-column:1/-1;color:var(--muted);padding:35px}.menu-loading{height:170px;border:1px solid var(--line);background:linear-gradient(90deg,#f3eee5 25%,#fbf8f2 50%,#f3eee5 75%);background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}footer{background:#080808;color:#fff;padding:55px 8vw;display:flex;align-items:center;gap:15px}footer strong{font-family:'Playfair Display';font-size:28px}footer span{color:var(--gold2)}footer small{margin-right:auto;color:#777}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.nav{padding:0 20px}.nav nav{display:none}.category-page-head,.category-page-body{padding-left:20px;padding-right:20px}.category-page-head{padding-top:52px}.grid{grid-template-columns:1fr}}@media(max-width:520px){.category-page-head h1{font-size:44px}}
</style>
</head>
<body>
<header class="nav"><div class="brand">ARABISK<span>RESTAURANT & CAFE</span></div><nav><a href="/">الرئيسية</a><a href="/menu">استكشف المنيو</a><a href="/reservation">حجز طاولة</a><a href="/#about">عن المطعم</a><a href="/#contact">تواصل معنا</a></nav><a class="lang" href="/menu">AR</a></header>
<main><section class="category-page-head"><a class="back-btn" href="/menu">← كل الأقسام</a><p id="detail-eyebrow" class="eyebrow">MENU</p><h1 id="detail-title">القسم</h1><p id="detail-lead"></p></section><section class="category-page-body"><div class="detail-head"><label class="search"><input id="menu-search" type="search" placeholder="ابحث داخل القسم…" autocomplete="off"></label></div><div id="grid" class="grid"><div class="menu-loading"></div><div class="menu-loading"></div><div class="menu-loading"></div></div></section></main>
<footer id="contact"><strong>ARABISK</strong><span>Restaurant & Cafe</span><small>© 2026 ARABISK. All rights reserved.</small></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slug=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const key=decodeURIComponent(location.pathname.replace(/\/$/,'')).split('/')[2]||'';const root=document.querySelector('#grid'),search=document.querySelector('#menu-search');let items=[],category;
function render(){const q=search.value.trim().toLowerCase();const list=q?items.filter(i=>`${i.nameAr} ${i.nameEn}`.toLowerCase().includes(q)):items;root.innerHTML=list.map(i=>{const visual=i.imageUrl||'';return `<a class="item item-link" href="/menu/${slug(category.id)}/${slug(i.nameEn||i.nameAr)}"><div>${visual?`<div class="item-thumb" style="background-image:url('${esc(visual)}')"></div>`:''}<span class="cat">${esc(i.nameEn)}</span><h3>${esc(i.nameAr||i.nameEn)}</h3><p>${esc(i.descriptionAr||'اختيار مميز من قائمة ARABISK.')}</p></div><div class="item-bottom"><div class="price">AED ${Number(i.price).toFixed(0)}</div><span class="item-open">التفاصيل ←</span></div></a>`}).join('')||'<p class="empty-menu">لا توجد أصناف في هذا القسم.</p>'}
(async()=>{try{const [a,b]=await Promise.all([fetch('/api/categories',{cache:'no-store'}),fetch('/api/products',{cache:'no-store'})]);if(!a.ok||!b.ok)throw new Error();const [cats,all]=await Promise.all([a.json(),b.json()]);category=cats.find(c=>slug(c.id)===key);if(!category){location.assign('/menu');return}items=all.filter(p=>p.categoryId===category.id);document.title=`${category.nameAr||category.nameEn} — ARABISK`;document.querySelector('#detail-eyebrow').textContent=(category.nameEn||'MENU').toUpperCase();document.querySelector('#detail-title').textContent=category.nameAr||category.nameEn;document.querySelector('#detail-lead').textContent=`استكشف أصناف ${category.nameAr||category.nameEn}.`;render();search.addEventListener('input',render)}catch(e){console.error(e);root.innerHTML='<p class="empty-menu">تعذر تحميل القسم حاليًا.</p>'}})();
</script>
</body></html>
