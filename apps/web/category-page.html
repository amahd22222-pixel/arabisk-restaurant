<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ARABISK — أصناف القسم"><title>ARABISK — القسم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#111;--black:#0d0d0d;--gold:#b89455;--gold2:#d2b16d;--cream:#f6f1e7;--paper:#fffdf8;--muted:#817a6e;--line:#ded6c8}*{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font-family:Cairo,sans-serif}.nav{height:82px;background:var(--black);color:#fff;display:flex;align-items:center;padding:0 6vw;gap:42px;position:sticky;top:0;z-index:10}.brand{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:3px;line-height:1}.brand span{display:block;font-family:Cairo;font-size:8px;letter-spacing:2px;color:var(--gold2);margin-top:7px}.nav nav{display:flex;gap:28px;margin:auto}.nav a{color:#eee;text-decoration:none;font-size:14px}.nav a:hover{color:var(--gold2)}.lang{display:inline-flex;align-items:center;justify-content:center;border:1px solid #6f624f;background:none;color:#fff;border-radius:50%;width:38px;height:38px;text-decoration:none}.category-banner{min-height:430px;background-size:cover;background-position:center;display:flex;align-items:flex-end;position:relative;color:#fff;overflow:hidden}.category-banner-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.3) 60%,rgba(0,0,0,.55))}.category-banner-content{position:relative;z-index:2;width:100%;padding:56px 8vw 64px}.back-btn{display:inline-block;color:#fff;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.18);padding:10px 18px;border-radius:999px;text-decoration:none;margin-bottom:36px}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:4px;margin:0 0 18px}.category-banner h1{font-family:'Playfair Display',serif;font-size:clamp(48px,7vw,82px);font-weight:500;line-height:1;margin:0 0 16px}.category-banner-lead{max-width:620px;color:#eee;line-height:1.9;font-size:16px;margin:0}.category-page-body{padding:48px 8vw 100px;background:var(--paper);min-height:calc(100vh - 512px)}.detail-head{display:flex;align-items:center;justify-content:flex-start;margin-bottom:28px}.search{width:min(440px,100%)}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 16px;font:inherit;color:var(--ink);outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item{background:var(--cream);border:1px solid var(--line);padding:25px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.15s}.item:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.05)}.item-link{color:inherit;text-decoration:none}.item .cat{font-size:10px;color:var(--gold);letter-spacing:2px}.item h3{font-size:18px;margin:10px 0}.item p{color:var(--muted);font-size:12px;margin:0;line-height:1.8}.item-thumb{height:185px;margin:-25px -25px 18px;background-size:cover;background-position:center}.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.price{font-family:'Playfair Display',serif;color:var(--gold);font-size:24px;direction:ltr;text-align:left}.item-open{font-size:12px;color:var(--gold);font-weight:600}.empty-menu{text-align:center;grid-column:1/-1;color:var(--muted);padding:35px}.menu-loading{height:170px;border:1px solid var(--line);background:linear-gradient(90deg,#f3eee5 25%,#fbf8f2 50%,#f3eee5 75%);background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}footer{background:#080808;color:#fff;padding:55px 8vw;display:flex;align-items:center;gap:15px}footer strong{font-family:'Playfair Display';font-size:28px}footer span{color:var(--gold2)}footer small{margin-right:auto;color:#777}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.nav{padding:0 20px}.nav nav{display:none}.category-banner{min-height:360px}.category-banner-content,.category-page-body{padding-left:20px;padding-right:20px}.grid{grid-template-columns:1fr}}@media(max-width:520px){.category-banner h1{font-size:46px}}
</style>
</head>
<body>
<header class="nav"><div class="brand">ARABISK<span>RESTAURANT & CAFE</span></div><nav><a href="/">الرئيسية</a><a href="/menu">استكشف المنيو</a><a href="/reservation">حجز طاولة</a><a href="/#about">عن المطعم</a><a href="/#contact">تواصل معنا</a></nav><a class="lang" href="/menu">AR</a></header>
<main><section class="category-banner" id="category-banner"><div class="category-banner-overlay"></div><div class="category-banner-content"><a class="back-btn" href="/menu">← كل الأقسام</a><p id="detail-eyebrow" class="eyebrow">MENU</p><h1 id="detail-title">القسم</h1><p id="detail-lead" class="category-banner-lead"></p></div></section><section class="category-page-body"><div class="detail-head"><label class="search"><input id="menu-search" type="search" placeholder="ابحث داخل القسم…" autocomplete="off"></label></div><div id="grid" class="grid"><div class="menu-loading"></div><div class="menu-loading"></div><div class="menu-loading"></div></div></section></main>
<footer id="contact"><strong>ARABISK</strong><span>Restaurant & Cafe</span><small>© 2026 ARABISK. All rights reserved.</small></footer>
<script>
const images={Breakfast:'https://images.unsplash.com/photo-1570882716056-9b4919acaf51?auto=format&fit=crop&w=1800&q=85',Manakish:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1800&q=85','Cold Appetizers':'https://images.unsplash.com/photo-1577805947697-89e18249d767?auto=format&fit=crop&w=1800&q=85','Hot Appetizers':'https://images.unsplash.com/photo-1623653387945-2fd25214f8fc?auto=format&fit=crop&w=1800&q=85',Salads:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=1800&q=85',Soups:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1800&q=85',Sandwich:'https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=1800&q=85',Pizza:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1800&q=85',Pasta:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=1800&q=85','Main Course':'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1800&q=85','Mixed Grill':'https://images.unsplash.com/photo-1633857471930-bfa8d0be5e4a?auto=format&fit=crop&w=1800&q=85','Mixed Taste':'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1800&q=85',Desserts:'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1800&q=85','Cheese Cake':'https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=1800&q=85','Arabisk Ice Cream':'https://images.unsplash.com/photo-1497032205916-ac775f0649ae?auto=format&fit=crop&w=1800&q=85','Cocktail & Refreshing Drinks':'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=1800&q=85','Energy Drinks':'https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=1800&q=85',Juices:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=1800&q=85',Mojitos:'https://images.unsplash.com/photo-1568926825354-c277ddca9bec?auto=format&fit=crop&w=1800&q=85','Milk Shakes':'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=1800&q=85',Tea:'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=1800&q=85',Coffee:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1800&q=85',Latte:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=1800&q=85','Soft Drinks':'https://images.unsplash.com/photo-1543253687-c4b3b9c1aa8d?auto=format&fit=crop&w=1800&q=85','Drinking Water':'https://images.unsplash.com/photo-1560023907-5f339617ea30?auto=format&fit=crop&w=1800&q=85',Sheesha:'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=1800&q=85'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const slug=v=>String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');const key=decodeURIComponent(location.pathname.replace(/\/$/,'')).split('/')[2]||'';const root=document.querySelector('#grid'),search=document.querySelector('#menu-search');let items=[],category;
function render(){const q=search.value.trim().toLowerCase();const list=q?items.filter(i=>`${i.nameAr} ${i.nameEn}`.toLowerCase().includes(q)):items;root.innerHTML=list.map(i=>{const visual=i.imageUrl||images[category.nameEn]||'';return `<a class="item item-link" href="/menu/${slug(category.id)}/${slug(i.nameEn||i.nameAr)}"><div>${visual?`<div class="item-thumb" style="background-image:url('${esc(visual)}')"></div>`:''}<span class="cat">${esc(i.nameEn)}</span><h3>${esc(i.nameAr||i.nameEn)}</h3><p>${esc(i.descriptionAr||'اختيار مميز من قائمة ARABISK.')}</p></div><div class="item-bottom"><div class="price">AED ${Number(i.price).toFixed(0)}</div><span class="item-open">التفاصيل ←</span></div></a>`}).join('')||'<p class="empty-menu">لا توجد أصناف في هذا القسم.</p>'}
(async()=>{try{const [a,b]=await Promise.all([fetch('/api/categories',{cache:'no-store'}),fetch('/api/products',{cache:'no-store'})]);if(!a.ok||!b.ok)throw new Error();const [cats,all]=await Promise.all([a.json(),b.json()]);category=cats.find(c=>slug(c.id)===key);if(!category){location.assign('/menu');return}items=all.filter(p=>p.categoryId===category.id);document.title=`${category.nameAr||category.nameEn} — ARABISK`;document.querySelector('#detail-eyebrow').textContent=(category.nameEn||'MENU').toUpperCase();document.querySelector('#detail-title').textContent=category.nameAr||category.nameEn;document.querySelector('#detail-lead').textContent=`استكشف تشكيلة ${category.nameAr||category.nameEn}.`;document.querySelector('#category-banner').style.backgroundImage=`url("${esc(category.imageUrl||images[category.nameEn]||'')}")`;render();search.addEventListener('input',render)}catch(e){console.error(e);root.innerHTML='<p class="empty-menu">تعذر تحميل القسم حاليًا.</p>'}})();
</script>
</body></html>
