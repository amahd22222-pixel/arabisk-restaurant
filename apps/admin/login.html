<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARABISK — تسجيل الدخول</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
<div id="login-screen" class="login-shell">
  <div class="login-card">
    <div class="login-brand">ARABISK<small>ADMIN</small></div>
    <div class="login-kicker">لوحة التحكم</div>
    <h1>تسجيل الدخول</h1>
    <p>أدخل بيانات حساب أدمن المطعم للوصول إلى لوحة التحكم.</p>
    <form id="login-form" class="login-form">
      <label>اسم المستخدم<input id="login-username" name="username" autocomplete="username" required></label>
      <label>كلمة المرور<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>
      <button class="submit" type="submit">دخول إلى لوحة التحكم</button>
    </form>
  </div>
</div>
<script type="module" src="./login.js"></script>
</body>
</html>
