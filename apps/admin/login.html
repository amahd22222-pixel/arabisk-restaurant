<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARABISK — تسجيل الدخول</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">ARABISK<small>ADMIN</small></div>
      <div class="login-kicker">لوحة التحكم</div>
      <h1 id="login-title">تسجيل الدخول</h1>
      <p>أدخل بيانات حساب أدمن المطعم للوصول إلى لوحة التحكم.</p>
      <form id="login-form" class="login-form">
        <label>اسم المستخدم<input id="login-username" name="username" autocomplete="username" required></label>
        <label>كلمة المرور<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <div id="login-error" class="login-error" role="alert"></div>
        <button class="submit" type="submit">دخول إلى لوحة التحكم</button>
      </form>
    </section>
  </main>
<script>
(function(){
  const key='ARABISK_LOGIN_SESSION';
  if(sessionStorage.getItem(key)==='1'){
    window.location.replace('/dashboard');
    return;
  }
  const form=document.getElementById('login-form');
  const error=document.getElementById('login-error');
  const button=form.querySelector('button[type="submit"]');
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const u=document.getElementById('login-username').value.trim();
    const p=document.getElementById('login-password').value;
    button.disabled=true;
    error.textContent='جارٍ التحقق…';
    try{
      const encoded=btoa(unescape(encodeURIComponent(`${u}:${p}`)));
      const response=await fetch('/auth/check',{method:'POST',headers:{Authorization:`Basic ${encoded}`},cache:'no-store'});
      if(!response.ok) throw new Error(response.status===401?'اسم المستخدم أو كلمة المرور غير صحيحة.':'تعذر التحقق من بيانات الدخول.');
      sessionStorage.setItem(key,'1');
      document.getElementById('login-password').value='';
      window.location.replace('/dashboard');
    }catch(err){
      sessionStorage.removeItem(key);
      error.textContent=err.message;
    }finally{
      button.disabled=false;
    }
  });
})();
</script>
</body>
</html>
