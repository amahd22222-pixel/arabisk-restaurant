name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Repository hygiene
        run: node scripts/verify-repository-hygiene.mjs
      - name: Verify syntax
        run: npm run verify:syntax

      - name: Run tests
        run: npm test

      - name: Build workspaces
        run: npm run build
