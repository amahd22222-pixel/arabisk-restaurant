name: Production quality gate

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-build.yml'
      - 'tests/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-build.yml'
      - 'tests/**'
      - 'scripts/**'

jobs:
  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_ADMIN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Repository hygiene
        run: node scripts/verify-repository-hygiene.mjs

      - name: Validate server syntax
        run: |
          node --check apps/admin/server.js
          node --check apps/admin/login.js
          node --check apps/web/server.js
          node --check apps/web/config.js
          node --check apps/web/storage.js
          node --check apps/web/admin-auth.js
          node --check apps/web/repositories/state-repository.js
          node --check apps/web/services/order-service.js
          node --check apps/web/routes/order-routes.js
          node --check apps/web/routes/customer-routes.js
          node --check apps/web/routes/reservation-routes.js
          node --check apps/web/services/media-service.js
          node --check apps/web/routes/media-routes.js
          node --check apps/web/services/category-service.js
          node --check apps/web/routes/category-routes.js
          node --check apps/web/services/studio-service.js
          node --check apps/web/routes/studio-routes.js
          node --check apps/web/services/experience-service.js
          node --check apps/web/routes/experience-routes.js
          node --check apps/web/services/memory-service.js
          node --check apps/web/routes/memory-routes.js
          node --check apps/web/services/customer-service.js
          node --check apps/web/services/reservation-service.js
          node --check apps/web/services/revenue-service.js
          node --check apps/web/routes/revenue-routes.js
          node --check apps/web/services/promotion-service.js
          node --check apps/web/routes/promotion-routes.js
          node --check apps/web/pwa-ui.js
          node --check apps/web/pwa-register.js
          node --check apps/web/mobile-nav.js
          node --check apps/web/home-shell.js
          node --check apps/web/sw.js

      - name: Verify Railway private API fallback
        shell: bash
        run: |
          set -euo pipefail
          actual="$(env ARABISK_WEB_API_URL=https://stale-public-url.example ARABISK_WEB_API_PRIVATE_DOMAIN=custom-web.railway.internal ARABISK_WEB_API_PRIVATE_PORT=8080 NODE_ENV=production RAILWAY_ENVIRONMENT_NAME=production node --input-type=module -e "import('./apps/admin/config.js').then(({webApiBase})=>process.stdout.write(webApiBase))")"
          test "$actual" = "https://stale-public-url.example"
          railway_actual="$(env ARABISK_WEB_API_URL=https://stale-public-url.example ARABISK_WEB_API_PRIVATE_DOMAIN=custom-web.railway.internal ARABISK_WEB_API_PRIVATE_PORT=8080 NODE_ENV=production RAILWAY_ENVIRONMENT_NAME=production RAILWAY_PROJECT_ID=ci-project node --input-type=module -e "import('./apps/admin/config.js').then(({webApiBase})=>process.stdout.write(webApiBase))")"
          test "$railway_actual" = "http://custom-web.railway.internal:8080"

      - name: Build admin
        run: npm run build --workspace apps/admin

      - name: Build web
        run: npm run build --workspace apps/web

      - name: Verify PWA build assets
        shell: bash
        run: |
          set -euo pipefail
          for file in manifest.json sw.js offline.html pwa-ui.js pwa-register.js mobile-nav.js mobile-nav.css home-app.css home-shell.js; do
            test -f "apps/web/dist/$file"
          done
          test -f apps/web/dist/icons/icon.svg
          test -f apps/web/dist/icons/maskable.svg
          grep -q '"display": "standalone"' apps/web/dist/manifest.json

      - name: Domain unit tests
        run: npm test

      - name: Admin runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          ARABISK_ADMIN_USERNAME=ci ARABISK_ADMIN_PASSWORD=ci ARABISK_ADMIN_API_KEY="$CI_ADMIN_KEY" PORT=4185 npm run start --workspace apps/admin > /tmp/arabisk-admin.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4185/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/arabisk-admin.log
              exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4185/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:4185/login
          curl -fsSI http://127.0.0.1:4185/login | grep -qi '^X-Content-Type-Options: nosniff'
          curl -fsSI http://127.0.0.1:4185/login | grep -qi '^Content-Security-Policy:'
          curl -fsSI http://127.0.0.1:4185/login | grep -qi '^X-Request-Id:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4185/proxy/api/orders)" = "401"
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/oversized-login.json').write_text('{"username":"' + ('x' * 300000) + '","password":"x"}')
          PY
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/oversized-login.json http://127.0.0.1:4185/auth/check)" = "413"
          cat /tmp/arabisk-admin.log

      - name: Web runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { status=$?; kill ${web_pid:-} ${admin_pid:-} ${revenue_pid:-} 2>/dev/null || true; if [ "$status" -ne 0 ]; then cat /tmp/arabisk-web.log /tmp/arabisk-admin-web-smoke.log /tmp/arabisk-web-revenue.log 2>/dev/null || true; fi; exit "$status"; }; trap cleanup EXIT
          wait_for_http() {
            local pid="$1" url="$2" label="$3"
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null 2>&1; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$label process exited before readiness"
                return 1
              fi
              sleep 0.5
            done
            echo "$label did not become ready"
            return 1
          }

          NODE_ENV=production RAILWAY_ENVIRONMENT_NAME=production ARABISK_ADMIN_API_KEY="$CI_ADMIN_KEY" PORT=4186 npm run start --workspace apps/web > /tmp/arabisk-web.log 2>&1 &
          web_pid=$!
          wait_for_http "$web_pid" http://127.0.0.1:4186/health "web" 
          curl -fsS http://127.0.0.1:4186/health | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:4186/health | grep -qi '^X-Content-Type-Options: nosniff'
          curl -fsSI http://127.0.0.1:4186/health | grep -qi '^X-Request-Id:'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Arabisk-Admin-Key: $CI_ADMIN_KEY" http://127.0.0.1:4186/api/orders)" = "200"
          test -z "$(curl -s -D - -o /dev/null -H 'Origin: http://localhost:5173' http://127.0.0.1:4186/health | grep -i '^Access-Control-Allow-Origin:')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{' http://127.0.0.1:4186/api/orders)" = "400"
          NODE_ENV=production RAILWAY_ENVIRONMENT_NAME=production ARABISK_WEB_API_URL=http://127.0.0.1:4186 ARABISK_ADMIN_USERNAME=ci ARABISK_ADMIN_PASSWORD=ci ARABISK_ADMIN_API_KEY="$CI_ADMIN_KEY" PORT=4175 npm run start --workspace apps/admin > /tmp/arabisk-admin-web-smoke.log 2>&1 &
          admin_pid=$!
          wait_for_http "$admin_pid" http://127.0.0.1:4175/health "admin"
          NODE_ENV=production RAILWAY_ENVIRONMENT_NAME=production ARABISK_ADMIN_API_KEY="$CI_ADMIN_KEY" PORT=4187 npm run start --workspace apps/web > /tmp/arabisk-web-revenue.log 2>&1 &
          revenue_pid=$!
          wait_for_http "$revenue_pid" http://127.0.0.1:4187/health "revenue web"
          promotion_status="$(curl -sS -o /tmp/ci-promotion.json -w '%{http_code}' http://127.0.0.1:4187/api/promotions/install)"
          test "$promotion_status" = "200" || { cat /tmp/ci-promotion.json; exit 1; }
          today_status="$(curl -sS -o /tmp/ci-today-offer.json -w '%{http_code}' http://127.0.0.1:4187/api/promotions/today)"
          test "$today_status" = "200" || { cat /tmp/ci-today-offer.json; exit 1; }
          promo_claim_status="$(curl -sS -o /tmp/ci-promo-claim.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{"clientId":"ci-install-client"}' http://127.0.0.1:4187/api/promotions/install/claim)"
          test "$promo_claim_status" = "201" || { cat /tmp/ci-promo-claim.json; exit 1; }
          promo_code="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["code"])' /tmp/ci-promo-claim.json)"
          promo_quote="$(curl -fsS -H 'Content-Type: application/json' --data "$(python - "$promo_code" <<'PY'
          import json,sys
          print(json.dumps({'code':sys.argv[1],'subtotal':100}))
          PY
          )" http://127.0.0.1:4187/api/promotions/install/quote)"
          python - "$promo_quote" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          print("promotion-quote-response:", data)
          assert data.get('discount', 0) > 0, f"promotion quote missing discount: {data}"
          assert data.get('total', 0) < data.get('subtotal', 1), f"promotion quote total not discounted: {data}"
          PY
          for i in {1..180}; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{"event":"menu_view","sessionId":"ci-rate-limit"}' http://127.0.0.1:4187/api/events)" = "202"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data '{"event":"menu_view","sessionId":"ci-rate-limit"}' http://127.0.0.1:4187/api/events)" = "429"
          echo "Admin proxy connected smoke test: admin -> web -> API"
          curl -fsS -c /tmp/arabisk-admin.cookies -H 'Content-Type: application/json' --data '{"username":"ci","password":"ci"}' http://127.0.0.1:4175/auth/check > /tmp/admin-login.json
          grep -q '"ok":true' /tmp/admin-login.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/categories > /tmp/admin-proxy-categories.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/products > /tmp/admin-proxy-products.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/orders > /tmp/admin-proxy-orders.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/experiences > /tmp/admin-proxy-experiences.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/admin/memories > /tmp/admin-proxy-memories.json
          curl -fsS -b /tmp/arabisk-admin.cookies http://127.0.0.1:4175/proxy/api/studio/shows > /tmp/admin-proxy-studio.json
          python - <<'PY'
          import json
          categories=json.load(open('/tmp/admin-proxy-categories.json'))
          products=json.load(open('/tmp/admin-proxy-products.json'))
          orders=json.load(open('/tmp/admin-proxy-orders.json'))
          experiences=json.load(open('/tmp/admin-proxy-experiences.json'))
          memories=json.load(open('/tmp/admin-proxy-memories.json'))
          studio=json.load(open('/tmp/admin-proxy-studio.json'))
          assert len(categories) > 0, 'admin proxy must expose categories from web'
          assert len(products) > 0, 'admin proxy must expose products from web'
          assert isinstance(orders, list), 'admin proxy orders response must be a list'
          assert isinstance(experiences, list), 'admin proxy experiences response must be a list'
          assert isinstance(memories, list), 'admin proxy memories response must be a list'
          assert isinstance(studio, list), 'admin proxy studio response must be a list'
          print(f'proxy-connected categories={len(categories)} products={len(products)} orders={len(orders)} experiences={len(experiences)} memories={len(memories)} studio={len(studio)}')
          PY

          curl -fsS http://127.0.0.1:4187/api/products > /tmp/ci-products.json
          product_id="$(python - <<'PY'
          import json
          with open('/tmp/ci-products.json') as f:
              products=json.load(f)
          print(next(p['id'] for p in products if p.get('available') is not False))
          PY
          )"
          order_json="$(python - "$product_id" "$promo_code" <<'PY'
          import json, sys
          print(json.dumps({
              "orderType":"pickup",
              "tableNumber":"",
              "name":"CI Customer",
              "phone":"0500000001",
              "notes":"",
              "sessionId":"ci-order-completion-smoke",
              "promoCode":sys.argv[2],
              "items":[{"productId":sys.argv[1],"quantity":1}]
          }))
          PY
          )"
          curl -fsS -H 'Content-Type: application/json' --data "$order_json" http://127.0.0.1:4187/api/orders > /tmp/ci-order.json
          order_id="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/ci-order.json'))
          assert data['discount'] > 0, 'install promotion must discount order'
          assert data['total'] < data['subtotal'], 'discounted order total must be below subtotal'
          print(data['id'])
          PY
          )"
          before_completed="$(curl -fsS -H "X-Arabisk-Admin-Key: $CI_ADMIN_KEY" http://127.0.0.1:4187/api/revenue/summary | python -c 'import json,sys; print(json.load(sys.stdin)["funnel"]["completedOrders"])')"
          test "$before_completed" = "0"

          for status in confirmed preparing ready completed; do
            curl -fsS -H 'Content-Type: application/json' -H "X-Arabisk-Admin-Key: $CI_ADMIN_KEY" --data "$(python -c "import json; print(json.dumps({'status':'$status'}))")" -X PATCH "http://127.0.0.1:4187/api/orders/$order_id" >/tmp/ci-order-status.json
          done

          python - <<'PY'
          import json
          payload=json.load(open('/tmp/ci-order-status.json'))
          assert payload['status']=='completed'
          assert payload.get('completedAt'), 'completedAt must be recorded when an order completes'
          PY
          after_completed="$(curl -fsS -H "X-Arabisk-Admin-Key: $CI_ADMIN_KEY" http://127.0.0.1:4187/api/revenue/summary | python -c 'import json,sys; print(json.load(sys.stdin)["funnel"]["completedOrders"])')"
          test "$after_completed" = "1"
          customer_stats="$(curl -fsS -H "X-Arabisk-Admin-Key: $CI_ADMIN_KEY" http://127.0.0.1:4187/api/customers | python -c 'import json,sys; rows=json.load(sys.stdin); matches=[row for row in rows if row.get("phone")=="0500000001"]; assert len(matches)==1, "CI customer should exist"; assert matches[0].get("orderCount")==1, "customer orderCount must increment on completion"; assert matches[0].get("lastOrderAt"), "customer lastOrderAt must be set on completion"; print("ok")')"
          test "$customer_stats" = "ok"

          cat /tmp/arabisk-web.log /tmp/arabisk-admin-web-smoke.log /tmp/arabisk-web-revenue.log
