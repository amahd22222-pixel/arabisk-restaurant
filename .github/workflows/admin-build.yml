name: Admin build guard

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-build.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-build.yml'

jobs:
  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate server syntax
        run: |
          node --check apps/admin/server.js
          node --check apps/admin/login.js
          node --check apps/web/server.js

      - name: Build admin
        run: npm run build --workspace apps/admin

      - name: Build web
        run: npm run build --workspace apps/web

      - name: Admin runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=4175 npm run start --workspace apps/admin > /tmp/arabisk-admin.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4175/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/arabisk-admin.log
              exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4175/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:4175/login
          curl -fsSI http://127.0.0.1:4175/login | grep -qi '^X-Content-Type-Options: nosniff'
          curl -fsSI http://127.0.0.1:4175/login | grep -qi '^Content-Security-Policy:'
          curl -fsSI http://127.0.0.1:4175/login | grep -qi '^X-Request-Id:'
          cat /tmp/arabisk-admin.log

      - name: Web runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=4176 npm run start --workspace apps/web > /tmp/arabisk-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/health > /tmp/web-health.json; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/arabisk-web.log
              exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4176/health | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:4176/health | grep -qi '^X-Content-Type-Options: nosniff'
          curl -fsSI http://127.0.0.1:4176/health | grep -qi '^X-Request-Id:'
          cat /tmp/arabisk-web.log
